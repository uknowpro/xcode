name: CLI CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=256 --max-semi-space-size=8
  UV_THREADPOOL_SIZE: '2'

jobs:
  test:
    name: Node 22 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run test:docs
      - run: npm run test:install
      - name: Exercise the terminal with a PTY
        if: runner.os == 'Linux'
        run: python3 test/terminal.py
      - uses: actions/setup-python@v6
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'
      - name: Install the Windows test-only pseudoterminal adapter
        if: runner.os == 'Windows'
        run: python -m pip install "pywinpty>=2.0.15,<4"
      - name: Exercise terminal editing on Windows
        if: runner.os == 'Windows'
        run: python test/platform-terminal.py
      - name: Exercise terminal editing on Linux and macOS
        if: runner.os != 'Windows'
        run: python3 test/platform-terminal.py

  package:
    name: Verified release assets
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Package and verify the checksum
        run: |
          npm run package:release
          XCODE_INSTALL_REPORT="$PWD/dist/install-report.json" npm run test:install
          npm run benchmark:workspace -- --output dist/workspace-benchmark.json
          node scripts/release-report.mjs dist
          (cd dist && sha256sum -c SHA256SUMS)
          {
            echo '## Release verification'
            echo ''
            echo '- Node.js 22 on Linux, macOS and Windows passed tests, docs, install and rollback.'
            echo '- Linux, macOS and Windows passed interactive keyboard, resize and draft-resume tests.'
            echo '- Linux also passed the full terminal smoke test.'
            echo '- Two packages built from the same checkout matched byte for byte.'
            echo '- The packed archive passed SHA-256 verification.'
            echo ''
            echo 'Commit: `'${GITHUB_SHA}'`'
            echo ''
            cat dist/SHA256SUMS
          } > dist/release-evidence.md
          cat dist/release-evidence.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: xcode-release
          path: dist/
          if-no-files-found: error
