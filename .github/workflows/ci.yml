name: CLI CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=256 --max-semi-space-size=8
  UV_THREADPOOL_SIZE: '2'

jobs:
  test:
    name: Node 22 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run test:docs
      - run: npm run test:install
      - name: Exercise the terminal with a PTY
        if: runner.os == 'Linux'
        run: python3 test/terminal.py
